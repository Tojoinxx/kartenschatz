name: Japanische Kartendaten

on:
  schedule:
    - cron: '23 22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/jp-data.mjs
      - name: Speichern
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "kartenschatz-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jp
          if git diff --cached --quiet; then echo "keine Änderungen"; exit 0; fi
          git commit -m "Japanische Kartendaten aktualisiert"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
